<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Selector de SbN Macrozona Sur</title>
<meta name="description" content="Plataforma de apoyo a la decisión para seleccionar soluciones basadas en la naturaleza en proyectos de construcción de la macrozona sur de Chile.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: portal institucional. Banda verde de cabecera con marca propia y navegación con íconos,
   portada con paisaje del sur difuminado y fichas de cifras en color; vistas de trabajo en una
   columna de 1240 px con gráficos de barras gruesas apiladas por criterio. */
:root{
  --fondo:#f2f5f1; --hoja:#ffffff; --hoja-2:#edf2ec; --hoja-3:#e2eae3;
  --tinta:#13221a; --tinta-2:#44574c; --tinta-3:#68796f;
  --linea:#d5ded7; --linea-2:#b3c3b8;
  --verde:#0f6b3f; --verde-osc:#0a4a2c; --verde-txt:#0f6b3f; --verde-suave:#dfeee4;
  --acento:#f2c230; --acento-osc:#d9a90f; --sobre-acento:#1f1a08;
  --sobre-verde:#f4faf6;
  /* criterios: paleta validada (OKLCH, CVD, contraste) */
  --c-amb:#2f8f5b; --c-tec:#3b6fb6; --c-eco:#b07a12; --c-soc:#c4506a;
  /* bandas (estado): siempre con ícono y texto */
  --b-rec:#17663f; --b-res:#946200; --b-no:#b23a31;
  --b-rec-f:#e3f1e8; --b-res-f:#f8eed5; --b-no-f:#f9e4e1;
  /* niveles: secuencial de un solo tono, N4 más intenso */
  --n4:#1d6a43; --n3:#5c9a72; --n2:#a8cbb2; --n1:#e2eee5;
  --n4-t:#ffffff; --n3-t:#ffffff; --n2-t:#13221a; --n1-t:#44574c;
  /* fichas de cifras de la portada */
  --t1:#0f6b3f; --t1-t:#ffffff; --t2:#cfe1d3; --t2-t:#13221a;
  --t3:#5566ad; --t3-t:#ffffff; --t4:#946226; --t4-t:#ffffff;
  --sombra:0 1px 2px rgba(19,34,26,.06),0 4px 14px rgba(19,34,26,.06);
  --sombra-2:0 10px 30px rgba(10,40,25,.16);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Figtree","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;
  --r:10px; --r-g:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#0d1511; --hoja:#15201a; --hoja-2:#1b2821; --hoja-3:#223229;
  --tinta:#e4ece6; --tinta-2:#a9bbaf; --tinta-3:#819387; --linea:#2a3a31; --linea-2:#3e5447;
  --verde:#0d5a35; --verde-osc:#08341f; --verde-txt:#6cc495; --verde-suave:#1b3428;
  --acento:#f2c230; --acento-osc:#e0b21c; --sobre-acento:#1f1a08; --sobre-verde:#eef7f1;
  --c-amb:#48a774; --c-tec:#6a91d4; --c-eco:#bb8a30; --c-soc:#d0657e;
  --b-rec:#5cbb87; --b-res:#e0ab45; --b-no:#ee7d73;
  --b-rec-f:#183327; --b-res-f:#33290f; --b-no-f:#3a1d1a;
  --n4:#55b481; --n3:#2f7651; --n2:#264a37; --n1:#1c2e25;
  --n4-t:#0d1511; --n3-t:#f1f7f3; --n2-t:#dbe7df; --n1-t:#a9bbaf;
  --t1:#0f6b3f; --t1-t:#ffffff; --t2:#2b4537; --t2-t:#e4ece6;
  --t3:#4d5c9c; --t3-t:#ffffff; --t4:#80551f; --t4-t:#ffffff;
  --sombra:0 1px 2px rgba(0,0,0,.35); --sombra-2:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --fondo:#0d1511; --hoja:#15201a; --hoja-2:#1b2821; --hoja-3:#223229;
  --tinta:#e4ece6; --tinta-2:#a9bbaf; --tinta-3:#819387; --linea:#2a3a31; --linea-2:#3e5447;
  --verde:#0d5a35; --verde-osc:#08341f; --verde-txt:#6cc495; --verde-suave:#1b3428;
  --acento:#f2c230; --acento-osc:#e0b21c; --sobre-acento:#1f1a08; --sobre-verde:#eef7f1;
  --c-amb:#48a774; --c-tec:#6a91d4; --c-eco:#bb8a30; --c-soc:#d0657e;
  --b-rec:#5cbb87; --b-res:#e0ab45; --b-no:#ee7d73;
  --b-rec-f:#183327; --b-res-f:#33290f; --b-no-f:#3a1d1a;
  --n4:#55b481; --n3:#2f7651; --n2:#264a37; --n1:#1c2e25;
  --n4-t:#0d1511; --n3-t:#f1f7f3; --n2-t:#dbe7df; --n1-t:#a9bbaf;
  --t1:#0f6b3f; --t1-t:#ffffff; --t2:#2b4537; --t2-t:#e4ece6;
  --t3:#4d5c9c; --t3-t:#ffffff; --t4:#80551f; --t4-t:#ffffff;
  --sombra:0 1px 2px rgba(0,0,0,.35); --sombra-2:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:15.5px;line-height:1.6;margin:0;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--verde)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--verde-txt);text-underline-offset:3px;text-decoration-thickness:1px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px;border-radius:4px}
.num,td.num,th.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.ico{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.saltar{position:absolute;left:-9999px;top:0;background:var(--hoja);color:var(--tinta);padding:.6rem 1rem;z-index:60}
.saltar:focus{left:.5rem;top:.5rem}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cont{max-width:1240px;margin:0 auto}

/* ---------- barra superior (utilidades) ---------- */
.util{background:var(--hoja-2);border-bottom:1px solid var(--linea);font-size:.84rem;color:var(--tinta-2)}
.util .cont{display:flex;align-items:center;gap:.25rem 1rem;min-height:2.4rem;flex-wrap:wrap;padding-block:.2rem}
.util-nav{display:flex;gap:.1rem .9rem;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.util-nav a{color:var(--tinta-2);text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;padding:.25rem 0}
.util-nav a:hover,.util-nav a[aria-current="page"]{color:var(--tinta);text-decoration:underline}
.util-der{display:flex;gap:.5rem;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--linea-2);border-radius:999px;overflow:hidden;background:var(--hoja)}
.seg button{border:0;background:transparent;color:var(--tinta-2);font-size:.8rem;font-weight:600;padding:.22rem .7rem}
.seg button[aria-pressed="true"]{background:var(--verde);color:var(--sobre-verde)}
.btn-ico{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border:1px solid var(--linea-2);background:var(--hoja);
  color:var(--tinta-2);border-radius:999px;font-size:.8rem;font-weight:600;padding:.22rem .65rem}
.btn-ico:hover{color:var(--tinta)}
.ver{font-family:var(--mono);font-size:.74rem;color:var(--tinta-3)}

/* ---------- cabecera verde ---------- */
.cab{background:var(--verde);color:var(--sobre-verde);position:relative;z-index:30}
@media (min-width:900px){.cab{position:sticky;top:env(safe-area-inset-top,0px)}}
.cab .cont{display:flex;align-items:center;gap:1rem 2rem;padding-block:.85rem;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:.9rem;color:inherit;text-decoration:none;min-width:0;flex:1 1 24rem}
.logo{width:56px;height:56px;flex:none;border:1.5px solid rgba(255,255,255,.85);border-radius:6px;display:grid;place-items:center}
.logo svg{width:38px;height:38px}
.marca-txt{display:grid;gap:.05rem;min-width:0}
.marca-txt small{font-size:.86rem;opacity:.9;line-height:1.3}
.marca-txt strong{font-size:clamp(1.02rem,2vw,1.28rem);font-weight:700;line-height:1.2;letter-spacing:.005em}
.nav{display:flex;gap:.2rem;flex-wrap:wrap;align-items:center}
.nav a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .7rem;border-radius:8px;
  font-size:.93rem;font-weight:500;white-space:nowrap;opacity:.92}
.nav a:hover{background:rgba(255,255,255,.1);opacity:1}
.nav a[aria-current="page"]{opacity:1;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;font-weight:700}
@media (max-width:899px){
  .nav{flex-wrap:nowrap;overflow-x:auto;margin-inline:-.4rem;width:calc(100% + .8rem);scrollbar-width:none;padding-bottom:.1rem}
  .nav::-webkit-scrollbar{display:none}
  .logo{width:46px;height:46px}.logo svg{width:31px;height:31px}
}

/* ---------- estructura ---------- */
main{padding-block:1.6rem 3.5rem}
.vista{display:grid;gap:2.4rem}
.vista>*,.rej>*,.rej-2>*,.rej-3>*,.fila-flex>*,.tarj-grid>*,.campos>*,.kpis>*{min-width:0}
.cabeza{display:grid;gap:.7rem;max-width:78ch}
.migas{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-3);
  display:flex;gap:.45rem;flex-wrap:wrap}
.migas a{color:inherit;text-decoration:none}.migas a:hover{color:var(--tinta)}
.t1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,4.6vw,3.1rem);letter-spacing:-.012em;line-height:1.08}
.t2{font-family:var(--serif);font-weight:400;font-size:clamp(1.45rem,2.8vw,1.95rem);letter-spacing:-.006em}
.t3{font-size:1.06rem;font-weight:700}
.lead{font-size:1.06rem;color:var(--tinta-2);max-width:70ch}
.sec{display:grid;gap:1rem}
.sec-cab{display:flex;align-items:end;justify-content:space-between;gap:.6rem 1.5rem;flex-wrap:wrap}
.sec-cab>div{display:grid;gap:.35rem;max-width:72ch}
.sutil{color:var(--tinta-2)}
.mini{font-size:.82rem;color:var(--tinta-3)}
.rej-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1.1rem}
.rej-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:1rem}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:1.15rem 1.2rem;box-shadow:var(--sombra)}
.caja.plana{box-shadow:none}
.lista{margin:0;padding-left:1.15rem;display:grid;gap:.4rem}

/* ---------- botones ---------- */
.acciones{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn,.btn-2,.btn-am{display:inline-flex;align-items:center;gap:.5rem;border-radius:8px;font-size:.95rem;font-weight:700;
  padding:.65rem 1.1rem;text-decoration:none;border:1.5px solid transparent;line-height:1.2}
.btn{background:var(--verde);color:var(--sobre-verde);border-color:var(--verde)}
.btn:hover{background:var(--verde-osc);border-color:var(--verde-osc)}
.btn-am{background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
.btn-am:hover{background:var(--acento-osc);border-color:var(--acento-osc)}
.btn-2{background:var(--hoja);color:var(--tinta);border-color:var(--linea-2)}
.btn-2:hover{border-color:var(--tinta-3)}
.btn-3{background:none;border:0;padding:.15rem 0;color:var(--verde-txt);font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.btn:disabled,.btn-2:disabled{opacity:.5;cursor:not-allowed}

/* ---------- portada ---------- */
.hero{position:relative;border-radius:var(--r-g);overflow:hidden;background:#29483a;color:#fff;isolation:isolate}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:60% 50%;z-index:-2;transform:scale(1.04)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(100deg,rgba(6,34,21,.88) 0%,rgba(6,34,21,.72) 38%,rgba(6,34,21,.30) 70%,rgba(6,34,21,.18) 100%)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.62fr);gap:2rem;padding:clamp(1.6rem,5vw,3.6rem);align-items:center}
.hero-txt{display:grid;gap:1.15rem;max-width:44rem}
.hero .migas{color:rgba(255,255,255,.8)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.15rem,5.6vw,3.9rem);line-height:1.05;letter-spacing:-.018em}
.hero h1 em{font-style:italic;font-weight:300;color:#cfe8d6}
.hero p.lead{color:rgba(255,255,255,.9);font-size:clamp(1rem,1.6vw,1.16rem)}
.hero .btn-2{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.7)}
.hero .btn-2:hover{background:rgba(255,255,255,.16)}
.mapa{width:100%;max-width:240px;justify-self:center}
.mapa svg{width:100%;height:auto;display:block;overflow:visible}
.mapa .tierra{fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.75);stroke-width:1.2}
.mapa .lago{fill:rgba(165,205,222,.55)}
.mapa .limite{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1;stroke-dasharray:3 3}
.mapa .volcan{fill:rgba(255,255,255,.85)}
.mapa .reg{fill:rgba(255,255,255,.82);font:600 9.5px var(--sans);letter-spacing:.12em}
.mapa .com{fill:#59c286;stroke:#0b3a24;stroke-width:1.4;cursor:pointer}
.mapa .com:hover,.mapa .com.sel{fill:var(--acento);r:6}
.mapa-pie{font-size:.74rem;color:rgba(255,255,255,.78);text-align:center;margin-top:.4rem}
@media (max-width:760px){.hero-in{grid-template-columns:1fr}.mapa{max-width:170px;justify-self:start}}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:-2.2rem;padding-inline:clamp(1rem,3vw,2.2rem);position:relative}
.tile{border-radius:14px;padding:1rem 1.1rem;display:grid;gap:.2rem;box-shadow:var(--sombra-2);min-width:0}
.tile .ico{width:2rem;height:2rem;stroke-width:1.5}
.tile b{font-size:clamp(1.7rem,3.6vw,2.35rem);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:.9rem;font-weight:600;line-height:1.3}
.tile.a{background:var(--t1);color:var(--t1-t)}.tile.b{background:var(--t2);color:var(--t2-t)}
.tile.c{background:var(--t3);color:var(--t3-t)}.tile.d{background:var(--t4);color:var(--t4-t)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:1rem;padding-inline:0}}

.pasos3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:1rem;counter-reset:p}
.paso{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:1.1rem 1.2rem;display:grid;gap:.45rem;
  grid-template-columns:auto 1fr;align-items:start;column-gap:.9rem}
.paso .n{counter-increment:p;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--verde-suave);color:var(--verde-txt);
  display:grid;place-items:center;font-weight:800;grid-row:span 2}
.paso .n::before{content:counter(p)}
.paso p{grid-column:2;color:var(--tinta-2);font-size:.94rem}

/* ---------- avisos ---------- */
.aviso{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;align-items:start;background:var(--hoja);border:1px solid var(--linea);
  border-left:4px solid var(--c-tec);border-radius:8px;padding:.85rem 1rem;font-size:.94rem}
.aviso>.ico{grid-row:span 3;width:1.35rem;height:1.35rem;color:var(--c-tec);margin-top:.1rem}
.aviso>*:not(.ico){grid-column:2}
.aviso .et{font-weight:700}
.aviso.ok{border-left-color:var(--b-rec)}.aviso.ok>.ico{color:var(--b-rec)}
.aviso.alerta{border-left-color:var(--b-res)}.aviso.alerta>.ico{color:var(--b-res)}
.aviso.grave{border-left-color:var(--b-no)}.aviso.grave>.ico{color:var(--b-no)}

/* ---------- etiquetas ---------- */
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;font-size:.76rem;font-weight:700;padding:.12rem .6rem .12rem .45rem;
  white-space:nowrap;line-height:1.5;border:1px solid transparent}
.pill .ico{width:.95em;height:.95em;stroke-width:2.6}
.pill.rec{background:var(--b-rec-f);color:var(--b-rec);border-color:color-mix(in srgb,var(--b-rec) 35%,transparent)}
.pill.res{background:var(--b-res-f);color:var(--b-res);border-color:color-mix(in srgb,var(--b-res) 35%,transparent)}
.pill.no{background:var(--b-no-f);color:var(--b-no);border-color:color-mix(in srgb,var(--b-no) 35%,transparent)}
.pill.neutra{background:var(--hoja-2);color:var(--tinta-2);border-color:var(--linea)}
.niv{display:inline-grid;place-items:center;min-width:2.1rem;font-size:.76rem;font-weight:800;border-radius:5px;padding:.1rem .3rem;font-variant-numeric:tabular-nums}
.niv.N4{background:var(--n4);color:var(--n4-t)}.niv.N3{background:var(--n3);color:var(--n3-t)}
.niv.N2{background:var(--n2);color:var(--n2-t)}.niv.N1{background:var(--n1);color:var(--n1-t);box-shadow:inset 0 0 0 1px var(--linea-2)}
.sens{color:var(--b-res);font-weight:800;cursor:help}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--linea-2);background:var(--hoja);color:var(--tinta-2);
  border-radius:999px;font-size:.84rem;padding:.3rem .75rem}
button.chip{font-weight:600}
button.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde)}
.chip .ico{color:var(--verde-txt)}
.sw{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;flex:none}
.sw.amb{background:var(--c-amb)}.sw.tec{background:var(--c-tec)}.sw.eco{background:var(--c-eco)}.sw.soc{background:var(--c-soc)}
.leyenda{display:flex;gap:.4rem 1.1rem;flex-wrap:wrap;font-size:.86rem;color:var(--tinta-2);align-items:center}
.leyenda span{display:inline-flex;gap:.4rem;align-items:center}

/* ---------- gráfico de orden (barras gruesas apiladas) ---------- */
.rk{display:grid;gap:.55rem;position:relative}
.rk-fila{display:grid;grid-template-columns:minmax(11rem,17rem) minmax(0,1fr) 3.6rem;gap:.35rem 1rem;align-items:center;
  border-radius:10px;padding:.35rem .5rem;margin-inline:-.5rem}
.rk-fila.clic{cursor:pointer}
.rk-fila.clic:hover,.rk-fila[aria-expanded="true"]{background:var(--hoja-2)}
.rk-et{display:flex;align-items:center;gap:.55rem;min-width:0}
.rk-pos{width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none;
  background:var(--hoja-3);color:var(--tinta-2);font-variant-numeric:tabular-nums}
.rk-fila.primera .rk-pos{background:var(--acento);color:var(--sobre-acento)}
.rk-nom{display:grid;min-width:0;line-height:1.25}
.rk-nom b{font-weight:700;font-size:.97rem;overflow-wrap:anywhere}
.rk-nom small{font-size:.76rem;color:var(--tinta-3);display:flex;flex-wrap:wrap;gap:.2rem .45rem;align-items:center;margin-top:.15rem}
.rk-nom small .mini{white-space:nowrap}
.rk-val .u{font-size:.68em;font-weight:600;color:var(--tinta-3);margin-left:.1em}
.rk-pista{position:relative;height:var(--alto-barra,30px)}
.rk-fondo{position:absolute;inset:0;border-radius:6px;background:var(--hoja-2)}
.rk-corte{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed var(--tinta-3);opacity:.75}
.rk-barra{position:absolute;left:0;top:0;bottom:0;display:flex;gap:2px;min-width:3px}
.rk-barra i{display:block;height:100%;min-width:1px}
.rk-barra i:last-child{border-radius:0 5px 5px 0}
.rk-barra i.amb{background:var(--c-amb)}.rk-barra i.tec{background:var(--c-tec)}.rk-barra i.eco{background:var(--c-eco)}.rk-barra i.soc{background:var(--c-soc)}
.rk-rango{position:absolute;bottom:-7px;height:5px;border:1.5px solid var(--tinta-2);border-top:0;border-radius:0 0 3px 3px}
.rk-val{font-size:1.12rem;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.rk-val small{display:block;font-size:.68rem;font-weight:600;color:var(--tinta-3)}
.rk-eje{display:grid;grid-template-columns:minmax(11rem,17rem) minmax(0,1fr) 3.6rem;gap:1rem;font-size:.74rem;color:var(--tinta-3)}
.rk-eje>div{position:relative;height:2.6rem}
.rk-eje span{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.rk-eje span.corte{bottom:1.15rem;font-weight:700;color:var(--tinta-2)}
.rk-eje span.corte.der{transform:none}
.rk-eje span.corte.izq{transform:translateX(-100%)}
.rk-mas{grid-column:1/-1}
.rej-6{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:1rem}
.rk.compacto{gap:.25rem}
.rk.compacto .rk-fila{grid-template-columns:minmax(8rem,13rem) minmax(0,1fr) 3rem;padding:.2rem .4rem}
.rk.compacto .rk-val{font-size:.95rem}
.delta{font-size:.74rem;font-weight:800;font-variant-numeric:tabular-nums}
.delta.sube{color:var(--b-rec)}.delta.baja{color:var(--b-no)}.delta.igual{color:var(--tinta-3)}
@media (max-width:640px){
  .rk-fila,.rk.compacto .rk-fila{grid-template-columns:minmax(0,1fr) 3.2rem}
  .rk-et{grid-column:1/-1}
  .rk-eje{grid-template-columns:minmax(0,1fr) 3.2rem}
  .rk-eje>div:first-child{display:none}
  .rk-eje .pal{display:none}
  .ver{display:none}
}

/* ---------- anillo de puntaje ---------- */
.anillo{position:relative;display:inline-grid;place-items:center;flex:none}
.anillo svg{display:block;transform:rotate(-90deg)}
.anillo .pista{stroke:var(--hoja-3)}
.anillo b{position:absolute;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.anillo b small{display:block;font-size:.5em;font-weight:600;color:var(--tinta-3);text-align:center;margin-top:.15em}

/* ---------- tarjeta de la mejor opción ---------- */
.ganadora{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,15rem);gap:1.4rem 2rem;align-items:center;
  background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r-g);padding:clamp(1.1rem,3vw,1.8rem);box-shadow:var(--sombra);
  border-top:6px solid var(--acento)}
.ganadora .eti{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.ganadora h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,3.6vw,2.45rem);line-height:1.1;margin:.2rem 0 .5rem}
.datos-g{display:grid;gap:.65rem;border-left:1px solid var(--linea);padding-left:1.4rem}
.datos-g div{display:grid;gap:.05rem}
.datos-g dt{font-size:.78rem;color:var(--tinta-3);font-weight:600}
.datos-g dd{margin:0;font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:820px){.ganadora{grid-template-columns:auto minmax(0,1fr)}.datos-g{grid-column:1/-1;border-left:0;padding-left:0;
  border-top:1px solid var(--linea);padding-top:1rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}}
@media (max-width:480px){.ganadora{grid-template-columns:1fr}}
.siguientes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem}
.sig{display:flex;gap:1rem;align-items:center;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:.9rem 1rem}
.sig h3{font-size:1.04rem;font-weight:700}

/* ---------- matriz de calificaciones ---------- */
.matriz-env{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r);background:var(--hoja)}
table.matriz{border-collapse:separate;border-spacing:3px;width:100%;min-width:40rem;font-size:.86rem;padding:.4rem}
.matriz th{font-size:.72rem;font-weight:700;color:var(--tinta-2);text-align:center;padding:.3rem .2rem;vertical-align:bottom;line-height:1.25}
.matriz th.crit{border-bottom:4px solid;padding-bottom:.25rem;font-size:.78rem}
.matriz th.crit.amb{border-color:var(--c-amb)}.matriz th.crit.tec{border-color:var(--c-tec)}
.matriz th.crit.eco{border-color:var(--c-eco)}.matriz th.crit.soc{border-color:var(--c-soc)}
.matriz td{text-align:center;border-radius:5px;padding:.42rem .2rem;font-weight:800;font-size:.8rem}
.matriz td.nom{text-align:left;font-weight:600;padding-left:.4rem;white-space:nowrap}
.matriz td.N4{background:var(--n4);color:var(--n4-t)}.matriz td.N3{background:var(--n3);color:var(--n3-t)}
.matriz td.N2{background:var(--n2);color:var(--n2-t)}.matriz td.N1{background:var(--n1);color:var(--n1-t)}
.matriz td.pje{font-size:.95rem;text-align:right;padding-right:.5rem}

/* ---------- tablas ---------- */
.tabla-env{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r);background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.tabla-env table{min-width:32rem}
.tabla-env.compacta table{min-width:26rem;font-size:.84rem}
caption{text-align:left;font-size:.8rem;color:var(--tinta-2);padding:.6rem .8rem;border-bottom:1px solid var(--linea);background:var(--hoja-2);font-weight:600}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--linea);vertical-align:top}
thead th{background:var(--hoja-2);font-weight:700;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tr.total td{font-weight:700;background:var(--hoja-2);border-top:1px solid var(--linea-2)}
.ok{color:var(--b-rec);font-weight:700}.falla{color:var(--b-no);font-weight:700}

/* ---------- pestañas ---------- */
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--linea-2)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .9rem;font-size:.95rem;font-weight:600;color:var(--tinta-2);
  display:inline-flex;gap:.45rem;align-items:center;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--verde-txt);border-bottom-color:var(--verde-txt)}

/* ---------- formulario ---------- */
.form-env{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,19rem);gap:1.5rem;align-items:start}
@media (max-width:900px){.form-env{grid-template-columns:1fr}}
fieldset{border:1px solid var(--linea);background:var(--hoja);border-radius:var(--r);padding:1.1rem 1.2rem 1.25rem;margin:0;min-width:0}
legend{font-weight:700;font-size:1.02rem;padding:0 .4rem;display:inline-flex;gap:.5rem;align-items:center}
legend .ico{color:var(--verde-txt)}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1rem;margin-top:.4rem}
.campo{display:grid;gap:.3rem;align-content:start}
.campo label{font-size:.88rem;font-weight:700}
.campo .ayuda{font-size:.78rem;color:var(--tinta-3);line-height:1.4}
input[type="number"],input[type="text"],input[type="password"],select,textarea{font-family:var(--sans);font-size:.95rem;padding:.55rem .7rem;
  background:var(--hoja);color:var(--tinta);border:1.5px solid var(--linea-2);border-radius:8px;width:100%;min-width:0}
textarea{font-family:var(--mono);font-size:.8rem;line-height:1.5;min-height:9rem}
input:focus,select:focus,textarea:focus{border-color:var(--verde-txt);outline:2px solid color-mix(in srgb,var(--verde-txt) 30%,transparent);outline-offset:0}
input[aria-invalid="true"]{border-color:var(--b-no)}
.err{color:var(--b-no);font-size:.8rem;font-weight:600}
.resumen-lat{position:sticky;top:calc(var(--alto-cab,0px) + 1rem);display:grid;gap:.8rem}
.derivado{background:var(--hoja-2);color:var(--tinta-2)}

/* ---------- deslizadores ---------- */
.desl{display:grid;gap:.9rem}
.desl-f{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 3.4rem;gap:.7rem;align-items:center}
.desl-f label{font-size:.9rem;font-weight:700;display:inline-flex;gap:.45rem;align-items:center}
.desl-f output{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--verde-txt)}
input[type="range"].amb{accent-color:var(--c-amb)}input[type="range"].tec{accent-color:var(--c-tec)}
input[type="range"].eco{accent-color:var(--c-eco)}input[type="range"].soc{accent-color:var(--c-soc)}

/* ---------- fichas ---------- */
.tarj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:1rem}
.tarj{display:grid;gap:.6rem;text-align:left;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:1rem 1.05rem;
  color:inherit;font:inherit;box-shadow:var(--sombra);transition:transform .15s ease,box-shadow .15s ease}
.tarj:hover{transform:translateY(-2px);box-shadow:var(--sombra-2)}
.tarj[aria-pressed="true"]{outline:2.5px solid var(--verde-txt);outline-offset:-1px}
.tarj-cab{display:flex;gap:.8rem;align-items:center}
.tarj h3{font-size:1.04rem;font-weight:700;line-height:1.25}
.tarj .mini-barra{height:10px;display:flex;gap:2px;border-radius:4px;overflow:hidden;background:var(--hoja-2)}
.tarj .mini-barra i.amb{background:var(--c-amb)}.tarj .mini-barra i.tec{background:var(--c-tec)}
.tarj .mini-barra i.eco{background:var(--c-eco)}.tarj .mini-barra i.soc{background:var(--c-soc)}
.tarj-pie{display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--tinta-2)}
.ficha{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r-g);box-shadow:var(--sombra);overflow:hidden}
.ficha-cab{background:var(--verde);color:var(--sobre-verde);padding:clamp(1.1rem,3vw,1.7rem);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem 1.5rem;align-items:center}
.ficha-cab h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05}
.ficha-cab p{opacity:.92;max-width:65ch}
.ficha-cab .anillo .pista{stroke:rgba(255,255,255,.2)}
.ficha-cab .anillo b small{color:rgba(255,255,255,.8)}
.ficha-cuerpo{padding:clamp(1rem,3vw,1.7rem);display:grid;gap:1.4rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:.8rem}
.kpi{background:var(--hoja-2);border-radius:var(--r);padding:.8rem .9rem;display:grid;gap:.1rem}
.kpi dt{font-size:.78rem;font-weight:600;color:var(--tinta-3)}
.kpi dd{margin:0;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi dd small{font-size:.72rem;font-weight:600;color:var(--tinta-3)}
.def{display:grid;gap:.7rem;margin:0}
.def>div{display:grid;grid-template-columns:minmax(9rem,13rem) minmax(0,1fr);gap:.8rem;padding-bottom:.65rem;border-bottom:1px solid var(--linea)}
.def dt{font-size:.82rem;font-weight:700;color:var(--tinta-2)}
.def dd{margin:0}
@media (max-width:560px){.def>div{grid-template-columns:1fr;gap:.15rem}}
.secuencia{display:grid;gap:.6rem;counter-reset:c;list-style:none;margin:0;padding:0}
.secuencia li{display:grid;grid-template-columns:2.2rem 1.1rem minmax(0,1fr) minmax(0,10rem);gap:.4rem .8rem;align-items:start;
  background:var(--hoja-2);border-radius:var(--r);padding:.75rem .9rem}
.secuencia li::before{counter-increment:c;content:counter(c);width:2rem;height:2rem;border-radius:50%;background:var(--hoja);border:1.5px solid var(--linea-2);
  display:grid;place-items:center;font-weight:800;font-size:.86rem}
.secuencia .mat{width:1.1rem;height:2rem;border-radius:4px}
.secuencia .esp{font-weight:700;font-size:.88rem;text-align:right;font-variant-numeric:tabular-nums}
.secuencia .det{font-size:.86rem;color:var(--tinta-2)}
@media (max-width:620px){.secuencia li{grid-template-columns:2.2rem 1.1rem minmax(0,1fr)}.secuencia .esp{grid-column:3;text-align:left}}
.mat.veg{background:#4f9a5f}.mat.sus{background:#8a6340}.mat.gra{background:repeating-linear-gradient(45deg,#9aa39d 0 3px,#c7ccc8 3px 6px)}
.mat.geo{background:repeating-linear-gradient(90deg,#d9d2bd 0 2px,#b7ae95 2px 4px)}.mat.imp{background:#2c3330}
.mat.hor{background:#a7aeb0}.mat.agua{background:#4f86b8}.mat.tie{background:#c09a6b}.mat.otro{background:var(--linea-2)}
.costo-graf{display:grid;gap:.4rem}
.costo-pista{position:relative;height:46px;margin-top:1.6rem}
.costo-zona{position:absolute;top:10px;height:26px;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.costo-zona.N4{background:var(--n4);color:var(--n4-t);border-radius:6px 0 0 6px}.costo-zona.N3{background:var(--n3);color:var(--n3-t)}
.costo-zona.N2{background:var(--n2);color:var(--n2-t)}.costo-zona.N1{background:var(--n1);color:var(--n1-t);border-radius:0 6px 6px 0}
.costo-rango{position:absolute;top:3px;height:40px;border:2px solid var(--tinta);border-radius:6px;background:transparent}
.costo-marca{position:absolute;top:-1.5rem;transform:translateX(-50%);display:grid;justify-items:center;font-weight:800;font-size:.86rem;white-space:nowrap}
.costo-marca::after{content:"";width:3px;height:3.4rem;background:var(--tinta);border-radius:2px;margin-top:.1rem}
.costo-eje{position:relative;height:1.2rem;font-size:.74rem;color:var(--tinta-3)}
.costo-eje span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}

/* ---------- metodología ---------- */
.jerarquia{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
@media (max-width:900px){.jerarquia{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.jerarquia{grid-template-columns:1fr}}
.jer-obj{grid-column:1/-1;background:var(--verde);color:var(--sobre-verde);border-radius:var(--r);padding:.9rem 1.1rem;display:flex;gap:.8rem;align-items:center}
.jer-c{background:var(--hoja);border:1px solid var(--linea);border-top:6px solid;border-radius:var(--r);padding:.9rem;display:grid;gap:.55rem;align-content:start}
.jer-c.amb{border-top-color:var(--c-amb)}.jer-c.tec{border-top-color:var(--c-tec)}.jer-c.eco{border-top-color:var(--c-eco)}.jer-c.soc{border-top-color:var(--c-soc)}
.jer-c h3{font-size:1.05rem;display:flex;justify-content:space-between;gap:.5rem}
.jer-c h3 span{font-variant-numeric:tabular-nums}
.jer-s{background:var(--hoja-2);border-radius:8px;padding:.5rem .65rem;font-size:.86rem;display:grid;gap:.25rem}
.jer-s .b{height:6px;border-radius:3px;background:var(--hoja-3);overflow:hidden}
.jer-s .b i{display:block;height:100%}
.escalas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
@media (max-width:760px){.escalas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.escala{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:.9rem;display:grid;gap:.6rem}
.escala h3{font-size:.95rem;display:flex;gap:.45rem;align-items:center}
.escala-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;align-items:end;height:8.5rem}
.escala-cols div{display:flex;flex-direction:column;gap:.2rem;align-items:center;justify-content:flex-end;height:100%}
.escala-cols i{display:block;width:100%;border-radius:5px 5px 0 0;flex:none}
.escala-cols b{font-size:.74rem;font-variant-numeric:tabular-nums}
.escala-cols span{font-size:.72rem;color:var(--tinta-3);font-weight:700}
.estab{display:grid;gap:1rem}
.estab-f{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:.4rem 1rem;align-items:center}
.estab-p{position:relative;height:34px}
.estab-p .lin{position:absolute;left:0;right:0;top:16px;height:2px;background:var(--linea-2)}
.estab-p .ran{position:absolute;top:9px;height:16px;border-radius:8px;opacity:.28}
.estab-p .pto{position:absolute;top:10px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--hoja)}
.estab-p .inv{position:absolute;top:7px;width:20px;height:20px;transform:translateX(-50%) rotate(45deg);border:3px solid var(--b-no);background:var(--hoja)}
@media (max-width:560px){.estab-f{grid-template-columns:1fr}}

/* ---------- panel ---------- */
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1rem}
.exp{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:1rem 1.1rem;display:grid;gap:.6rem;align-content:start}
.exp.fuera{border-style:dashed;opacity:.8}
.exp-cab{display:flex;gap:.8rem;align-items:center}
.exp-cod{width:2.8rem;height:2.8rem;border-radius:50%;background:var(--verde-suave);color:var(--verde-txt);display:grid;place-items:center;font-weight:800;flex:none}
.pesos-b{display:flex;height:22px;gap:2px;border-radius:5px;overflow:hidden}
.pesos-b i{display:grid;place-items:center;font-style:normal;font-size:.68rem;font-weight:800;color:#fff;min-width:0;overflow:hidden}
.pesos-b i.amb{background:var(--c-amb)}.pesos-b i.tec{background:var(--c-tec)}.pesos-b i.eco{background:var(--c-eco)}.pesos-b i.soc{background:var(--c-soc)}

/* ---------- administración ---------- */
.login{max-width:30rem;margin-inline:auto;background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r-g);box-shadow:var(--sombra-2);
  padding:clamp(1.3rem,4vw,2.2rem);display:grid;gap:1rem}
.login-ico{width:3.2rem;height:3.2rem;border-radius:50%;background:var(--verde-suave);color:var(--verde-txt);display:grid;place-items:center}
.login-ico .ico{width:1.6rem;height:1.6rem}
.sesion{display:flex;gap:.6rem 1rem;align-items:center;flex-wrap:wrap;background:var(--verde-suave);border-radius:var(--r);padding:.7rem 1rem;font-size:.9rem}
.log{font-family:var(--mono);font-size:.76rem;display:grid;gap:.25rem;max-height:14rem;overflow:auto;background:var(--hoja);border:1px solid var(--linea);border-radius:8px;padding:.7rem}
.cita{font-family:var(--mono);font-size:.78rem;background:var(--hoja-2);border:1px solid var(--linea);border-radius:8px;padding:.7rem;overflow-wrap:anywhere}
.ref{padding-left:1.6rem;text-indent:-1.6rem}

/* ---------- informe ---------- */
.informe{background:var(--hoja);border:1px solid var(--linea-2);border-radius:var(--r);padding:clamp(1rem,4vw,2.4rem);max-width:84ch;font-size:.92rem;width:100%}
.informe h2{font-size:1.12rem;font-weight:700;border-bottom:2px solid var(--verde-txt);padding-bottom:.3rem;margin:1.5rem 0 .7rem}
.informe table{table-layout:fixed;font-size:.86rem}
.informe th,.informe td{overflow-wrap:anywhere;padding:.38rem .5rem}
.informe-cab{display:grid;gap:.4rem;border-bottom:3px solid var(--verde);padding-bottom:.9rem}
.sello{font-size:.76rem;color:var(--tinta-3);letter-spacing:.04em}

/* ---------- pie ---------- */
.pie{background:var(--verde-osc);color:#d9e8de;margin-top:1rem}
.pie .cont{padding-block:2.2rem 2.6rem;display:grid;gap:1.4rem}
.pie-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1.4rem;font-size:.9rem}
.pie-cols strong{color:#fff;display:block;margin-bottom:.3rem}
.pie a{color:#fff}
.pie .mini{color:#a9c6b3}

/* ---------- información emergente ---------- */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--tinta);color:var(--fondo);font-size:.82rem;line-height:1.4;padding:.5rem .65rem;
  border-radius:8px;max-width:17rem;box-shadow:var(--sombra-2);opacity:0;transition:opacity .1s}
#tip.ver{opacity:1}
#tip b{font-weight:800}
</style>

/* ==========================================================================
   B. ESTADO, IDIOMA Y PERSISTENCIA
   localStorage sólo guarda comodidades de este navegador (tema, idioma,
   escenarios y, si el administrador lo pide, el modelo editado). La página
   funciona igual si el almacenamiento no está disponible.
   ========================================================================== */
const APP_VERSION = "2.0";
const LLAVE = "sbn_sur_v3";
const clonar = o => JSON.parse(JSON.stringify(o));
const SUBS = ["RE","AE","IE","CO","CC","CM","AS","CV"];
const CRITS = ["amb","tec","eco","soc"];
const BASE_SOL = {}; DATOS_BASE.soluciones.forEach(s => BASE_SOL[s.id] = s);

const EST = {
  D: clonar(DATOS_BASE),
  bitacora: [], accesos: [], entrada: null, resultado: null,
  pesosSens: null, fichaAbierta: null, fichaTab: "ficha",
  comparar: [], escenarios: [], tema: null, lang: "es", expertoVista: "panel",
  admin: null, abierto: {}
};
/* El modelo sólo se guarda si el administrador lo editó: así una nueva publicación
   del archivo llega a todos los visitantes aunque hayan usado la página antes. */
function guardar(){
  try{ localStorage.setItem(LLAVE, JSON.stringify({ D:EST.editado ? EST.D : null, editado:!!EST.editado, bitacora:EST.bitacora,
    tema:EST.tema, lang:EST.lang, escenarios:EST.escenarios })); }catch(e){}
}
function recuperar(){
  try{
    const raw = localStorage.getItem(LLAVE); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && d.editado && d.D && d.D.criterios && d.D.soluciones){ EST.D = d.D; EST.editado = true; }
    if(d && Array.isArray(d.bitacora)) EST.bitacora = d.bitacora;
    if(d && Array.isArray(d.escenarios)) EST.escenarios = d.escenarios;
    if(d && d.tema) EST.tema = d.tema;
    if(d && (d.lang === "es" || d.lang === "en")) EST.lang = d.lang;
  }catch(e){}
}

/* --- idioma ----------------------------------------------------------- */
const T = (es, en) => EST.lang === "en" ? en : es;
const LOC = () => EST.lang === "en" ? "en-GB" : "es-CL";
function fmt(n, d){
  if(n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString(LOC(), { minimumFractionDigits:d, maximumFractionDigits:d });
}
function esc(s){ return String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }
function sol(id){ return EST.D.soluciones.find(s => s.id === id); }
function pal(s){ return (EST.lang === "en" && EN_DATA.palabras[s]) || s; }

/* Traducción de un campo de una tipología. Se usa el inglés sólo si el texto en
   castellano sigue siendo el de origen: si el administrador lo editó, se muestra
   lo editado, para no presentar una traducción de un texto que ya no existe. */
function ruta(o, r){ return r.reduce((a, k) => (a === null || a === undefined) ? undefined : a[k], o); }
function trad(s, r){
  const actual = ruta(s, r);
  if(EST.lang !== "en") return actual;
  const en = ruta(EN_DATA.soluciones[s.id], r), base = ruta(BASE_SOL[s.id], r);
  if(en === undefined || base === undefined) return actual;
  return JSON.stringify(base) === JSON.stringify(actual) ? en : actual;
}
function nomSol(id){ const s = sol(id); return s ? trad(s, ["nombre"]) : id; }
function critNombre(id){
  if(EST.lang === "en" && EN_DATA.criterios[id]) return EN_DATA.criterios[id].nombre;
  const c = EST.D.criterios.find(x => x.id === id); return c ? c.nombre : id; }
function critDef(id){
  if(EST.lang === "en" && EN_DATA.criterios[id]) return EN_DATA.criterios[id].definicion;
  const c = EST.D.criterios.find(x => x.id === id); return c ? c.definicion : ""; }
function subNom(id){
  if(EST.lang === "en" && EN_DATA.subcriterios[id]) return EN_DATA.subcriterios[id].nombre;
  const s = EST.D.subcriterios.find(x => x.id === id); return s ? s.nombre : id; }
function subDesc(id){
  if(EST.lang === "en" && EN_DATA.subcriterios[id]) return EN_DATA.subcriterios[id].descriptor;
  const s = EST.D.subcriterios.find(x => x.id === id); return s ? s.descriptor : ""; }
function nivNom(id){
  if(EST.lang === "en" && EN_DATA.niveles[id]) return EN_DATA.niveles[id];
  const n = EST.D.niveles.find(x => x.id === id); return n ? n.nombre : id; }
function txMeta(k){ return (EST.lang === "en" && EN_DATA.meta[k]) || EST.D.meta[k]; }
function critDe(id){ const s = EST.D.subcriterios.find(x => x.id === id); return s ? s.criterio : null; }
function hoy(){ return new Date().toLocaleDateString(LOC(), { day:"2-digit", month:"long", year:"numeric" }); }
function ahora(){ return new Date().toLocaleString(LOC(), { dateStyle:"short", timeStyle:"short" }); }

/* C.1 · nivel de costo de construcción DERIVADO del valor en UF/m² */
M.nivelCC = function(uf, u){
  u = u || EST.D.umbral_cc;
  if(uf === null || uf === undefined || isNaN(uf)) return null;
  if(uf < u.n4_n3) return "N4";
  if(uf < u.n3_n2) return "N3";
  if(uf < u.n2_n1) return "N2";
  return "N1";
};
/* C.2 · calificación efectiva: la asignada, con CC derivado del costo y CM de su bloque */
M.calif = function(s, opciones){
  opciones = opciones || {};
  const c = Object.assign({}, s.calif);
  c.CC = M.nivelCC(s.cc ? s.cc.uf : null);
  c.CM = s.cm ? s.cm.nivel : c.CM;
  if(opciones.alternativas) SUBS.forEach(k => { if(s.alt && s.alt[k]) c[k] = s.alt[k]; });
  return c;
};
/* C.3 · pesos globales: w_global = w_criterio × w_local */
M.pesos = function(pesosCriterio){
  const D = EST.D, wc = {};
  D.criterios.forEach(c => { wc[c.id] = pesosCriterio ? pesosCriterio[c.id] : c.peso; });
  const wg = {};
  D.subcriterios.forEach(s => { wg[s.id] = wc[s.criterio] * s.local; });
  return { wc, wg, suma: Object.values(wg).reduce((a,b) => a + b, 0) };
};
/* C.4 · puntaje con renormalización sobre los subcriterios con dato */
M.puntuar = function(calif, wg){
  const D = EST.D, vN = {}; D.niveles.forEach(n => vN[n.id] = n.v);
  const detalle = []; let tot = 0, sw = 0;
  D.subcriterios.forEach(s => {
    const nivel = calif[s.id];
    if(!nivel){ detalle.push({ sub:s.id, criterio:s.criterio, nivel:null, valor:null, peso:wg[s.id], aporte:0, sinDato:true }); return; }
    const valor = vN[nivel][s.criterio], peso = wg[s.id];
    tot += peso * valor; sw += peso;
    detalle.push({ sub:s.id, criterio:s.criterio, nivel, valor, peso, aporte: peso * valor, sinDato:false });
  });
  const puntaje = sw > 0 ? (tot / sw) * 100 : 0;
  detalle.forEach(d => { d.aportePct = d.sinDato ? 0 : (d.aporte / sw) * 100; });
  return { detalle, puntaje, sumaPesosConDato: sw, completa: sw > 0.9999 * Object.values(wg).reduce((a,b) => a + b, 0) };
};
/* C.5 · perfiles de referencia y bandas */
M.perfil = function(nivel, wg){ const c = {}; EST.D.subcriterios.forEach(s => c[s.id] = nivel); return M.puntuar(c, wg).puntaje; };
M.bandas = function(wg){ return { rec: M.perfil("N3", wg), acep: M.perfil("N2", wg) }; };
M.banda = function(p, b){ return p >= b.rec ? "rec" : (p >= b.acep ? "res" : "no"); };
/* C.6 · rango del puntaje por calificaciones sensibles */
M.rango = function(s, wg){
  const base = M.puntuar(M.calif(s), wg).puntaje;
  const alt  = M.puntuar(M.calif(s, { alternativas:true }), wg).puntaje;
  const sens = SUBS.filter(k => s.alt && s.alt[k]);
  if(!sens.length) return { min:base, max:base, base, sensibles:[] };
  return { min:Math.min(base, alt), max:Math.max(base, alt), base, sensibles:sens };
};
/* C.7 · filtro de aptitud previa, con lo que le falta a cada descartada */
function nomOpc(lista, id){ const o = (OPCIONES[lista] || []).find(x => x.id === id); return o ? (EST.lang === "en" ? o.en : o.nombre) : id; }
M.filtro = function(s, e){
  const r = s.reglas, motivos = [], avisos = [];
  const opInf = OPCIONES.infiltracion.find(o => o.id === e.infiltracion) || { infiltra:true };
  const dispo = (r.soporte === "cubierta" || r.soporte === "fachada") ? (e.cubierta || 0) : e.superficie;
  const etDispo = r.soporte === "cubierta" ? T("de cubierta","of roof") : (r.soporte === "fachada" ? T("de fachada","of façade") : T("de suelo","of ground"));
  const RF = T("Función","Function");
  if(e.finalidad === "hidrica" && s.aptitud.hidrica === false)

  if(e.finalidad === "termica" && s.aptitud.termica === false)
    motivos.push({ r:RF, t:T("No cumple función de regulación térmica.","It does not provide heat regulation."), falta:null });
  if(e.finalidad === "ambas" && (!s.aptitud.hidrica || !s.aptitud.termica))
    motivos.push({ r:RF, t:T("Cumple sólo una de las dos funciones solicitadas.","It provides only one of the two functions requested."), falta:null });
  const RE_ = T("Emplazamiento","Location");
  if(r.bnup === "requiere" && e.emplazamiento === "privado")
    motivos.push({ r:RE_, t:T("Se emplaza en bien nacional de uso público y el proyecto es íntegramente en predio privado.","It sits in public road space and the project is entirely on private land."),
      falta:T("Cambie el emplazamiento a «predio privado con obras en la faja vial» y tramite el permiso municipal.","Change the location to “private plot with works in the road reserve” and apply for the municipal permit.") });
  if(r.bnup === "no" && e.emplazamiento === "bnup")
    motivos.push({ r:RE_, t:T("Requiere una edificación de soporte y el proyecto es sólo en la faja vial.","It needs a supporting building and the project is only in the road reserve."), falta:null });
  const RS = T("Suelo","Soil");
  if(r.requiere_infiltracion && !opInf.infiltra)
    motivos.push({ r:RS, t:T("Depende de la infiltración y el suelo declarado no infiltra.","It depends on infiltration and the declared soil does not infiltrate."),
      falta:T("Sólo es viable con un dren de fondo conectado a la red, que queda fuera del alcance de esta herramienta.","It is only viable with an underdrain connected to the network, which is outside the scope of this tool.") });
  if(r.requiere_infiltracion && e.infiltracion === "desconocido")
    avisos.push(T("Exige un ensayo de infiltración previo: el resultado es provisorio hasta disponer de ese dato.","It needs an infiltration test first: the result is provisional until that figure is available."));
  if(r.pendiente_max !== null && e.pendiente > r.pendiente_max)
    motivos.push({ r:T("Pendiente","Slope"), t:T("La pendiente de "+fmt(e.pendiente,1)+" % supera el umbral de "+fmt(r.pendiente_max,0)+" % de la tipología.",
        "The "+fmt(e.pendiente,1)+" % slope exceeds this typology's "+fmt(r.pendiente_max,0)+" % limit."),
      falta:T("Rebajar la pendiente de la plataforma de trabajo a "+fmt(r.pendiente_max,0)+" % o menos, o aterrazar el paño.",
        "Reduce the slope of the working platform to "+fmt(r.pendiente_max,0)+" % or less, or terrace the area.") });
  if(r.superficie_min !== null && dispo < r.superficie_min)
    motivos.push({ r:T("Superficie","Area"), t:T("La superficie "+etDispo+" disponible ("+fmt(dispo,0)+" m²) no alcanza el mínimo de "+fmt(r.superficie_min,0)+" m².",
        "The available area "+etDispo+" ("+fmt(dispo,0)+" m²) is below the "+fmt(r.superficie_min,0)+" m² minimum."),
      falta:T("Faltan "+fmt(r.superficie_min - dispo,0)+" m² "+etDispo+" para que la tipología sea aplicable.",
        fmt(r.superficie_min - dispo,0)+" m² more "+etDispo+" are needed for the typology to apply.") });
  if(RANGO_ESPACIO[e.espacio] < RANGO_ESPACIO[r.espacio_min])
    motivos.push({ r:T("Espacio","Space"), t:T("Necesita espacio libre en superficie «"+nomOpc("espacio", r.espacio_min)+"» y el declarado es «"+nomOpc("espacio", e.espacio)+"».",
        "It needs “"+nomOpc("espacio", r.espacio_min)+"” open space and the declared space is “"+nomOpc("espacio", e.espacio)+"”."),
      falta:T("Liberar superficie hasta alcanzar la condición «"+nomOpc("espacio", r.espacio_min)+"».","Free up area until the space is “"+nomOpc("espacio", r.espacio_min)+"”.") });
  if(r.fraccion_area_drenada && e.area_drenada > 0){
    const nec = e.area_drenada * r.fraccion_area_drenada;
    if(dispo < nec) motivos.push({ r:T("Área de filtro","Filter area"),
      t:T("La superficie disponible ("+fmt(dispo,0)+" m²) es inferior al "+fmt(r.fraccion_area_drenada*100,0)+" % del área drenada conectada ("+fmt(nec,1)+" m² necesarios).",
        "The available area ("+fmt(dispo,0)+" m²) is below "+fmt(r.fraccion_area_drenada*100,0)+" % of the connected drained area ("+fmt(nec,1)+" m² needed)."),

        fmt(nec - dispo,1)+" m² more filter area are needed, or disconnect "+fmt((dispo / r.fraccion_area_drenada - e.area_drenada) * -1,0)+" m² of drained area.") });
    else avisos.push(T("Área de filtro verificada: "+fmt(dispo,0)+" m² disponibles frente a "+fmt(nec,1)+" m² necesarios ("+fmt(r.fraccion_area_drenada*100,0)+" % del área drenada).",
      "Filter area checked: "+fmt(dispo,0)+" m² available against "+fmt(nec,1)+" m² needed ("+fmt(r.fraccion_area_drenada*100,0)+" % of the drained area)."));

  return { admisible: motivos.length === 0, motivos, avisos };
};
/* C.8 · ajustes de calificación por condición de sitio */
M.ajustes = function(s, e, calif){
  const aplicados = [], c = Object.assign({}, calif);
  (EST.D.ajustes || []).forEach(a => {
    if(a.solucion !== s.id) return;
    if(a.cuando.infiltracion && !a.cuando.infiltracion.includes(e.infiltracion)) return;
    if(c[a.subcriterio] !== a.desde) return;
    c[a.subcriterio] = a.hacia; aplicados.push(a);
  });
  return { calif:c, aplicados };
};
function fundamentoAjuste(a){ return (EST.lang === "en" && EN_DATA.ajustes[a.solucion+"|"+a.subcriterio]) || a.fundamento; }
/* C.9 · evaluación completa de una consulta */
function evaluar(e, pesosCriterio){
  const D = EST.D;
  const prio = pesosCriterio ? { pesos:pesosCriterio, ajustado:false } : M.prioridad(e.prioridad);
  const { wc, wg, suma } = M.pesos(prio.pesos);
  const b = M.bandas(wg);
  const admisibles = [], descartadas = [];
  D.soluciones.filter(s => s.activa).forEach(s => {
    const f = M.filtro(s, e);
    if(!f.admisible){ descartadas.push({ sol:s, motivos:f.motivos }); return; }
    const aj = M.ajustes(s, e, M.calif(s));
    const p = M.puntuar(aj.calif, wg);
    admisibles.push({ sol:s, calif:aj.calif, ajustes:aj.aplicados, avisos:f.avisos, detalle:p.detalle, puntaje:p.puntaje,
      completa:p.completa, sumaPesosConDato:p.sumaPesosConDato, rango:M.rango(s, wg), banda:M.banda(p.puntaje, b) });
  });
  admisibles.sort((a, c) => c.puntaje - a.puntaje);
  admisibles.forEach((a, i) => { a.pos = i + 1; a.dif = i === 0 ? null : admisibles[i-1].puntaje - a.puntaje; });
  return { entrada:e, admisibles, descartadas, wc, wg, suma, bandas:b, prioridad:prio,
    modelo:{ version:D.meta.version, fecha:D.meta.fecha, estado:D.meta.estado }, sello:new Date().toISOString() };
}
/* C.10 · prioridad declarada por el mandante */
M.prioridad = function(p){
  const D = EST.D, base = {}; D.criterios.forEach(c => base[c.id] = c.peso);
  if(!p || p === "ninguna") return { pesos:base, ajustado:false };
  const f = FACTOR_PRIORIDAD, bruto = {}; let s = 0;
  D.criterios.forEach(c => { bruto[c.id] = c.peso * (c.id === p ? f : 1); s += bruto[c.id]; });
  const pesos = {}; D.criterios.forEach(c => pesos[c.id] = bruto[c.id] / s);
  return { pesos, ajustado:true, factor:f, criterio:p };
};
/* C.11 · estabilidad: punto de inversión por criterio y regla entre las dos primeras */
M.estabilidad = function(){
  const D = EST.D, { wg } = M.pesos();
  const rk = D.soluciones.filter(s => s.activa).map(s => ({ s, p:M.puntuar(M.calif(s), wg).puntaje })).sort((a,b) => b.p - a.p);
  if(rk.length < 2) return null;
  const a = rk[0].s, b = rk[1].s, ca = M.calif(a), cb = M.calif(b);
  const vN = {}; D.niveles.forEach(n => vN[n.id] = n.v);
  const AC = {};
  D.criterios.forEach(c => {
    const subs = D.subcriterios.filter(x => x.criterio === c.id);
    const f = cal => subs.reduce((t,x) => t + (cal[x.id] ? x.local * vN[cal[x.id]][c.id] : 0), 0) /
      subs.reduce((t,x) => t + (cal[x.id] ? x.local : 0), 0);
    AC[c.id] = { a:f(ca), b:f(cb), G:f(ca) - f(cb), peso:c.peso, rango:c.rango };
  });
  const pts = D.criterios.map(c => {
    const f = x => {
      const p = {}; p[c.id] = x;
      D.criterios.forEach(o => { if(o.id !== c.id) p[o.id] = o.peso * (1 - x) / (1 - c.peso); });
      const w = M.pesos(p).wg;
      return M.puntuar(ca, w).puntaje - M.puntuar(cb, w).puntaje;
    };
    let lo = 0.005, hi = 0.95;
    if(f(lo) * f(hi) > 0) return { criterio:c.id, x:null, dentro:false, peso:c.peso, rango:c.rango };
    for(let i = 0; i < 80; i++){ const m2 = (lo + hi) / 2; if(f(lo) * f(m2) <= 0) hi = m2; else lo = m2; }
    const x = (lo + hi) / 2;
    return { criterio:c.id, x, dentro: x >= c.rango[0] && x <= c.rango[1], peso:c.peso, rango:c.rango, cambio:(x - c.peso) / c.peso };
  });
  let regla = null;
  const planos = D.criterios.filter(c => Math.abs(AC[c.id].G) < 1e-9).map(c => c.id);
  const vivos = D.criterios.filter(c => Math.abs(AC[c.id].G) >= 1e-9);
  if(planos.length === 2 && vivos.length === 2){
    const pos = vivos.find(c => AC[c.id].G > 0), neg = vivos.find(c => AC[c.id].G < 0);
    if(pos && neg) regla = { razon: AC[pos.id].G / (-AC[neg.id].G), actual: neg.peso / pos.peso, favorable:pos.id, adverso:neg.id };
  }
  const dentro = pts.filter(p => p.x !== null && p.dentro);
  return { a, b, dif: rk[0].p - rk[1].p, AC, puntos:pts, regla, planos, estable: dentro.length === 0, invierten:dentro };
};
function textoRegla(est){
  const r = est.regla; if(!r) return "";
  return T(nomSol(est.b.id)+" supera a "+nomSol(est.a.id)+" cuando el peso "+critNombre(r.adverso).toLowerCase()+" es más de "+fmt(r.razon,2)+" veces el "+critNombre(r.favorable).toLowerCase(),
    nomSol(est.b.id)+" overtakes "+nomSol(est.a.id)+" when the "+critNombre(r.adverso).toLowerCase()+" weight is more than "+fmt(r.razon,2)+" times the "+critNombre(r.favorable).toLowerCase()+" weight");
}
/* C.12 · dominancia */
M.dominancia = function(){
  const D = EST.D, ord = { N1:1, N2:2, N3:3, N4:4 };
  const act = D.soluciones.filter(s => s.activa);
  return act.filter(x => !act.some(y => y.id !== x.id &&
    D.subcriterios.every(s => { const cx = M.calif(x)[s.id], cy = M.calif(y)[s.id]; return !cx || !cy || ord[cy] >= ord[cx]; }) &&
    D.subcriterios.some(s => { const cx = M.calif(x)[s.id], cy = M.calif(y)[s.id]; return cx && cy && ord[cy] > ord[cx]; })));
};
/* C.13 · agregación del panel por media geométrica: los pesos y los valores de nivel
   se DERIVAN de los vectores de los expertos incluidos */
M.agregarPanel = function(expertos){
  const inc = (expertos || EST.D.expertos).filter(x => x.enPanel);
  if(!inc.length) return null;
  const gm = arr => Math.exp(arr.reduce((a,b) => a + Math.log(Math.max(b, 1e-12)), 0) / arr.length);
  const ids = EST.D.criterios.map(c => c.id);
  const g = {}; ids.forEach(id => g[id] = gm(inc.map(x => x.w[id])));
  const sg = ids.reduce((a,id) => a + g[id], 0);
  const criterios = {}; ids.forEach(id => criterios[id] = g[id] / sg);
  const pares = { RE:"AE", IE:"CO", CC:"CM", AS:"CV" }, locales = {};
  Object.keys(pares).forEach(p1 => {
    const a = gm(inc.map(x => x.loc[p1])), b = gm(inc.map(x => 1 - x.loc[p1]));
    locales[p1] = a / (a + b); locales[pares[p1]] = b / (a + b);
  });
  const niveles = { N4:{}, N3:{}, N2:{}, N1:{} };
  ids.forEach(id => { niveles.N4[id] = 1; [1,2,3].forEach((k,i) => { niveles[["N3","N2","N1"][i]][id] = gm(inc.map(x => x.niv[id][k])); }); });
  return { criterios, locales, niveles, n:inc.length, codigos:inc.map(x => x.cod) };
};
M.aplicarPanel = function(){
  const ag = M.agregarPanel(); if(!ag) return false;
  const escalasVigentes = EST.D.escalas_por_experto_vigentes === true;
  EST.D.criterios.forEach(c => { c.peso = ag.criterios[c.id]; });
  EST.D.criterios.slice().sort((a,b) => b.peso - a.peso).forEach((c,i) => c.lugar = i + 1);
  EST.D.subcriterios.forEach(s => { s.local = ag.locales[s.id]; });
  if(escalasVigentes) EST.D.niveles.forEach(n => { EST.D.criterios.forEach(c => { n.v[c.id] = ag.niveles[n.id][c.id]; }); });
  return true;
};
M.segunExperto = function(x){
  const D = EST.D, wc = x.w, pares = { RE:"AE", IE:"CO", CC:"CM", AS:"CV" }, loc = {};
  Object.keys(pares).forEach(p => { loc[p] = x.loc[p]; loc[pares[p]] = 1 - x.loc[p]; });
  const wg = {}; D.subcriterios.forEach(s => { wg[s.id] = wc[s.criterio] * loc[s.id]; });
  const propias = D.escalas_por_experto_vigentes === true;
  const vN = { N4:{}, N3:{}, N2:{}, N1:{} };
  D.criterios.forEach(c => { ["N4","N3","N2","N1"].forEach((n,i) => { vN[n][c.id] = propias ? x.niv[c.id][i] : D.niveles[i].v[c.id]; }); });
  return D.soluciones.filter(s => s.activa).map(s => {
    const cal = M.calif(s); let t = 0, sw = 0;
    D.subcriterios.forEach(sb => { const nv = cal[sb.id]; if(!nv) return; t += wg[sb.id] * vN[nv][sb.criterio]; sw += wg[sb.id]; });
    return { sol:s, p: sw > 0 ? t / sw * 100 : 0 };
  }).sort((a,b) => b.p - a.p);
};

function etBanda(b){ return { rec:T("Recomendable","Recommended"), res:T("Aceptable con reservas","Acceptable with reservations"), no:T("No recomendable","Not recommended") }[b] || b; }

function pesosCriterios(lista){
  const max = 0.6;
  return '<div class="rk" role="list">'+lista.map(c => '<div class="rk-fila" role="listitem" style="grid-template-columns:minmax(7rem,9rem) minmax(0,1fr) 3.6rem" aria-label="'+
    esc(critNombre(c.id)+" "+fmt(c.peso*100,1)+" %")+'"><div class="rk-et"><i class="sw '+c.id+'"></i><b>'+esc(critNombre(c.id))+'</b></div>'+
    '<div class="rk-pista" style="--alto-barra:26px" data-tip="'+esc('<b>'+esc(critNombre(c.id))+'</b> '+fmt(c.peso,4)+'<br>'+T("Rango del panel: ","Panel range: ")+fmt(c.rango[0],3)+" – "+fmt(c.rango[1],3))+'">'+
    '<div class="rk-fondo"></div><div class="rk-barra" style="width:'+(c.peso/max*100)+'%"><i class="'+c.id+'" style="flex:1"></i></div>'+
    '<span class="rk-rango" style="left:'+(c.rango[0]/max*100)+'%;width:'+((c.rango[1]-c.rango[0])/max*100)+'%;bottom:-8px"></span></div>'+
    '<div class="rk-val">'+fmt(c.peso*100,1)+'<span class="u">%</span></div></div>').join("")+
    '<div class="rk-eje" style="grid-template-columns:minmax(7rem,9rem) minmax(0,1fr) 3.6rem"><div></div><div style="height:1.2rem">'+
    [0,.1,.2,.3,.4,.5,.6].map(v => '<span style="left:'+(v/max*100)+'%">'+fmt(v*100,0)+'</span>').join("")+'</div><div></div></div></div>';
}
function pesosSubcriterios(wg){
  const D = EST.D, lista = D.subcriterios.slice().sort((a, c) => wg[c.id] - wg[a.id]), max = Math.max(...lista.map(s => wg[s.id])) * 1.1;
  return '<div class="rk compacto" role="list">'+lista.map(s => '<div class="rk-fila" role="listitem" style="grid-template-columns:minmax(9rem,14rem) minmax(0,1fr) 3.2rem" aria-label="'+
    esc(subNom(s.id)+" "+fmt(wg[s.id]*100,1)+" %")+'"><div class="rk-et"><span class="niv N4" style="background:var(--c-'+s.criterio+');color:#fff">'+s.id+'</span><span style="font-size:.88rem">'+esc(subNom(s.id))+'</span></div>'+
    '<div class="rk-pista" style="--alto-barra:16px"><div class="rk-fondo"></div><div class="rk-barra" style="width:'+(wg[s.id]/max*100)+'%"><i class="'+s.criterio+'" style="flex:1"></i></div></div>'+
    '<div class="rk-val" style="font-size:.9rem">'+fmt(wg[s.id]*100,1)+'<span class="u">%</span></div></div>').join("")+'</div>';
}

    '</td><td class="num">'+fmt(d.aportePct,2)+'</td></tr>');
  filas.push('<tr class="total"><td colspan="4">'+T("Suma de los pesos con dato","Sum of weights with data")+'</td><td class="num">'+fmt(a.sumaPesosConDato,5)+'</td><td class="num">'+fmt(a.puntaje,2)+'</td></tr>');

    (a.avisos && a.avisos.length ? '<div class="aviso alerta">'+ico("alerta")+'<span class="et">'+T("Advertencias","Warnings")+'</span><p>'+a.avisos.map(esc).join("<br>")+'</p></div>' : '')+
    tabla(T("puntaje = 100 × Σ (peso global × valor del nivel) ÷ Σ (pesos con dato)","score = 100 × Σ (global weight × level value) ÷ Σ (weights with data)"),
      [{t:T("Subcriterio","Sub-criterion")},{t:T("Criterio","Criterion")},{t:T("Nivel","Level")},{t:T("Valor","Value"),num:true},{t:T("Peso global","Global weight"),num:true},{t:T("Aporte","Contribution"),num:true}],
      filas, "compacta")+
    '<div class="acciones"><a class="btn-2" href="#fichas" data-ficha="'+esc(s.id)+'">'+ico("hoja")+T("Ficha y recomendación constructiva","Sheet and construction recommendation")+'</a>'+

    '<tr><th style="text-align:left">'+T("Solución","Solution")+'</th>'+grupos.map(g => g.subs.map(s => '<th title="'+esc(subNom(s.id))+'">'+s.id+'</th>').join("")).join("")+
    '<th style="text-align:right">'+T("Puntaje","Score")+'</th></tr></thead><tbody>'+
    lista.map(a => '<tr><td class="nom">'+esc(nomSol(a.sol.id))+'</td>'+grupos.map(g => g.subs.map(s => { const n = a.calif[s.id];

function pintarSliders(){

    '<output id="o_'+c.id+'">'+fmt(act[c.id]*100,1)+'%</output></div>').join("")+
    '<p class="mini">'+T("Panel: ","Panel: ")+D.criterios.map(c => esc(critNombre(c.id)).toLowerCase()+" "+fmt(c.peso*100,1)+" %").join(" · ")+'</p>';
  cont.querySelectorAll('input[type="range"]').forEach(inp => inp.addEventListener("input", () => {
    const id = inp.dataset.c, nv = parseFloat(inp.value), ant = EST.pesosSens || clonar(base), resto = 1 - ant[id], p = {}; p[id] = nv;
    D.criterios.filter(c => c.id !== id).forEach(c => { p[c.id] = resto > 1e-9 ? (ant[c.id] / resto) * (1 - nv) : (1 - nv) / 3; });
    EST.pesosSens = p;
    D.criterios.forEach(c => { const o = el("o_"+c.id), s = el("s_"+c.id); if(o) o.textContent = fmt(p[c.id]*100,1)+"%"; if(s && c.id !== id) s.value = p[c.id]; });
    refrescarSens();
  }));
  el("btnPanelPesos").onclick = () => { EST.pesosSens = null; pintarSliders(); };
  el("btnGuardarEsc").onclick = () => {
    const p = EST.pesosSens || base, R = evaluar(EST.entrada, p);
    EST.escenarios.unshift({ t:ahora(), pesos:clonar(p), ganadora:R.admisibles.length ? R.admisibles[0].sol.id : null,
      puntaje:R.admisibles.length ? R.admisibles[0].puntaje : null });

/* Material de cada paso de la secuencia constructiva, sólo para el color del muestrario. */
function material(nombre){
  const s = nombre.toLowerCase();
  if(/drenante|reserva de grava/.test(s)) return "gra";
  if(/riego|dren |tubo|rebalse|canaleta|drenaje y|aberturas/.test(s)) return "agua";
  if(/geotextil|filtro|malla|estructura|subestructura|cierre|módulo/.test(s)) return "geo";
  if(/impermeab/.test(s)) return "imp";
  if(/grava|árido|drenante|reserva|disipación|base granular|arena/.test(s)) return "gra";
  if(/adocreto|adocésped|solera/.test(s)) return "hor";
  if(/sustrato|mezcla filtrante|tierra|mulch|relleno/.test(s)) return "sus";
  if(/excavación|limpieza|perfilado|descompact|franja/.test(s)) return "tie";
  if(/vegeta|planta|siembra|arbust|cobertura|pradera|césped/.test(s)) return "veg";
  return "otro";
}

    '<p class="mini">'+T("UF/m² · el recuadro es el rango de las fuentes y la marca, el valor adoptado. Los colores son los niveles del Anexo A.","UF/m² · the box is the range of the sources and the mark is the adopted value. Colours are the Annex A levels.")+'</p></div>';

      ${tabla(T("El asterisco marca una calificación sensible; entre paréntesis, el nivel alternativo.","The asterisk marks a sensitive rating; the alternative level is in brackets."),

PINTAR.comparar = function(){
  const D = EST.D, { wg } = M.pesos(), b = M.bandas(wg);
  const act = D.soluciones.filter(s => s.activa).sort((a, c) => a.orden - c.orden);
  if(!EST.comparar.length) EST.comparar = EST.resultado && EST.resultado.admisibles.length >= 2 ? EST.resultado.admisibles.slice(0, 2).map(a => a.sol.id) : act.slice(0, 2).map(s => s.id);
  const selec = EST.comparar.map(id => sol(id)).filter(Boolean);
  const calc = selec.map(s => { const p = M.puntuar(M.calif(s), wg); return { s, p, it:{ sol:s, pos:"", puntaje:p.puntaje, detalle:p.detalle, rango:M.rango(s, wg), banda:M.banda(p.puntaje, b) } }; });
  const ordenados = calc.slice().sort((x, y) => y.p.puntaje - x.p.puntaje);
  ordenados.forEach((c, i) => c.it.pos = i + 1);
  let difHTML = "";
  if(calc.length === 2){
    const [a, c] = ordenados, dif = a.p.puntaje - c.p.puntaje;
    const des = D.subcriterios.map(sb => { const da = a.p.detalle.find(x => x.sub === sb.id), dc = c.p.detalle.find(x => x.sub === sb.id);
      return { id:sb.id, criterio:sb.criterio, d:da.aportePct - dc.aportePct, na:da.nivel, nb:dc.nivel }; });
    const m = Math.max(1, ...des.map(x => Math.abs(x.d)));
    difHTML = `<section class="sec"><div class="sec-cab"><div><h2 class="t2">${T("De dónde viene la diferencia","Where the difference comes from")}</h2>
      <p class="sutil">${esc(nomSol(a.s.id))} ${T("supera a","beats")} ${esc(nomSol(c.s.id))} ${T("por","by")} <strong>${fmt(dif,2)}</strong> ${T("puntos. Cada barra es lo que aporta un subcriterio a esa diferencia: hacia la derecha favorece a la primera y hacia la izquierda, a la segunda.","points. Each bar is what one sub-criterion adds to that difference: to the right it favours the first, to the left the second.")}</p></div></div>
      <div class="caja"><div class="rk" role="list">
        <div class="rk-eje" aria-hidden="true"><div></div><div style="height:1.4rem"><span style="left:3%;transform:none;font-weight:700">← ${esc(nomSol(c.s.id))}</span><span style="left:97%;transform:translateX(-100%);font-weight:700">${esc(nomSol(a.s.id))} →</span></div><div></div></div>
        ${des.map(x => { const w = Math.abs(x.d) / m * 50;
          return '<div class="rk-fila" role="listitem" aria-label="'+esc(subNom(x.id)+": "+(x.d > 0 ? "+" : "")+fmt(x.d,2))+'"><div class="rk-et"><span class="niv N4" style="background:var(--c-'+x.criterio+');color:#fff">'+x.id+'</span><span style="font-size:.9rem">'+esc(subNom(x.id))+'</span></div>'+
            '<div class="rk-pista" style="--alto-barra:22px"><div class="rk-fondo"></div><div class="rk-corte" style="left:50%;border-left-style:solid"></div>'+
            (Math.abs(x.d) > 0.005 ? '<div class="rk-barra" style="left:'+(x.d >= 0 ? 50 : 50 - w)+'%;width:'+w+'%"><i class="'+x.criterio+'" style="flex:1;border-radius:'+(x.d >= 0 ? "0 5px 5px 0" : "5px 0 0 5px")+'"></i></div>' : '')+'</div>'+
            '<div class="rk-val" style="font-size:.92rem">'+(x.d > 0 ? "+" : "")+fmt(x.d,2)+'<small>'+niv(x.na)+' '+niv(x.nb)+'</small></div></div>'; }).join("")}
      </div></div></section>`;
  }
  el("v-comparar").innerHTML = `
  <div class="cabeza">${migas([["inicio",T("Inicio","Home")],["comparar",T("Comparar","Compare")]])}
    <h1 class="t1">${T("Comparador de soluciones","Solution comparison")}</h1>
    <p class="lead">${T("Elija hasta tres tipologías. Con dos, la plataforma descompone la diferencia subcriterio por subcriterio. Los puntajes son los del escenario base, sin filtros de sitio.",
      "Choose up to three typologies. With two, the platform breaks the difference down sub-criterion by sub-criterion. Scores are from the base scenario, without site filters.")}</p></div>
  <div class="caja plana"><div class="chips">${act.map(x => '<button class="chip" type="button" data-cmp="'+x.id+'" aria-pressed="'+EST.comparar.includes(x.id)+'">'+esc(nomSol(x.id))+'</button>').join("")}</div></div>
  ${calc.length ? '<div class="caja">'+leyendaCrit()+'<div style="margin-top:.9rem">'+graficoOrden(ordenados.map(c => c.it), { bandas:b })+'</div></div>' : '<p class="mini">'+T("Seleccione al menos una tipología.","Select at least one typology.")+'</p>'}
  ${difHTML}
  ${calc.length ? `<section class="sec"><div class="sec-cab"><div><h2 class="t2">${T("Ficha comparada","Side-by-side sheet")}</h2></div></div>
    ${tabla(null, [{t:T("Subcriterio","Sub-criterion")},{t:T("Peso global","Global weight"),num:true}].concat(ordenados.map(c => ({ t:esc(nomSol(c.s.id)) }))),
      D.subcriterios.map(sb => '<tr><td><i class="sw '+sb.criterio+'"></i> <strong>'+esc(sb.id)+'</strong> · '+esc(subNom(sb.id))+'</td><td class="num">'+fmt(wg[sb.id],4)+'</td>'+
        ordenados.map(c => { const d = c.p.detalle.find(x => x.sub === sb.id); return '<td>'+niv(d.nivel)+' <span class="mini">'+fmt(d.valor,3)+'</span></td>'; }).join("")+'</tr>')
      .concat(['<tr class="total"><td>'+T("Puntaje","Score")+'</td><td></td>'+ordenados.map(c => '<td>'+fmt(c.p.puntaje,1)+'</td>').join("")+'</tr>',
        '<tr><td>'+T("Banda","Band")+'</td><td></td>'+ordenados.map(c => '<td>'+pill(M.banda(c.p.puntaje, b))+'</td>').join("")+'</tr>',
        '<tr><td>'+T("Costo de construcción","Construction cost")+'</td><td></td>'+ordenados.map(c => '<td>'+fmt(c.s.cc.uf,2)+' UF/m²<br><span class="mini">$ '+fmt(c.s.cc.clp,0)+'</span></td>').join("")+'</tr>',
        '<tr><td>'+T("Mantención","Maintenance")+'</td><td></td>'+ordenados.map(c => '<td class="mini">'+esc(trad(c.s, ["cm","frecuencia"]))+'</td>').join("")+'</tr>',
        '<tr><td>'+T("Superficie mínima","Minimum area")+'</td><td></td>'+ordenados.map(c => '<td>'+fmt(c.s.reglas.superficie_min,0)+' m²</td>').join("")+'</tr>',
        '<tr><td>'+T("Precedente en el sur","Precedent in the south")+'</td><td></td>'+ordenados.map(c => '<td class="mini">'+esc(trad(c.s, ["ficha","precedente"]))+'</td>').join("")+'</tr>']))}</section>` : ''}`;
  document.querySelectorAll("[data-cmp]").forEach(x => x.addEventListener("click", () => {
    const id = x.dataset.cmp;
    if(EST.comparar.includes(id)) EST.comparar = EST.comparar.filter(y => y !== id);
    else { if(EST.comparar.length >= 3) EST.comparar.shift(); EST.comparar.push(id); }
    PINTAR.comparar(); }));
};

function graficoEstabilidad(est){
  const max = 0.7, x = v => v / max * 100;
  return '<div class="estab">'+est.puntos.map(p => '<div class="estab-f"><strong>'+esc(critNombre(p.criterio))+'</strong>'+
    '<div class="estab-p" role="img" aria-label="'+esc(critNombre(p.criterio)+": "+T("peso ","weight ")+fmt(p.peso,3)+(p.x === null ? T(", sin inversión",", no inversion") : T(", inversión en ",", inversion at ")+fmt(p.x,3)))+'">'+
      '<span class="lin"></span><span class="ran" style="left:'+x(p.rango[0])+'%;width:'+(x(p.rango[1]) - x(p.rango[0]))+'%;background:var(--c-'+p.criterio+')"></span>'+
      '<span class="pto" style="left:'+x(p.peso)+'%;background:var(--c-'+p.criterio+')" data-tip="'+esc(T("Peso del panel ","Panel weight ")+fmt(p.peso,4))+'"></span>'+
      (p.x !== null ? '<span class="inv" style="left:'+x(Math.min(max, p.x))+'%" data-tip="'+esc(T("Punto de inversión ","Inversion point ")+fmt(p.x,4)+(p.dentro ? T(" · dentro del rango"," · inside the range") : T(" · fuera del rango"," · outside the range")))+'"></span>' : '')+
    '</div></div>').join("")+
    '<div class="estab-f"><span></span><div class="costo-eje">'+[0,.1,.2,.3,.4,.5,.6,.7].map(v => '<span style="left:'+x(v)+'%">'+fmt(v,1)+'</span>').join("")+'</div></div>'+
    '<div class="leyenda"><span><span class="sw" style="background:var(--tinta-3);border-radius:50%"></span>'+T("peso del panel","panel weight")+'</span>'+
    '<span><span class="sw" style="background:var(--tinta-3);opacity:.3;width:1.4rem"></span>'+T("rango entre expertos","range across experts")+'</span>'+
    '<span><span class="sw" style="border:3px solid var(--b-no);transform:rotate(45deg);width:.7rem;height:.7rem"></span>'+T("peso en que se invierte el primer lugar","weight at which first place flips")+'</span></div></div>';
}

      ${D.criterios.map(c => '<div class="jer-c '+c.id+'"><h3>'+esc(critNombre(c.id))+'<span>'+fmt(c.peso*100,1)+' %</span></h3><p class="mini">'+esc(critDef(c.id))+'</p>'+

PINTAR.verificacion = function(){
  const D = EST.D, { wg } = M.pesos(), b = M.bandas(wg), tol = 0.005;
  const act = D.soluciones.filter(s => s.activa);
  const rk = act.map(s => ({ s, p:M.puntuar(M.calif(s), wg).puntaje })).sort((a, c) => c.p - a.p);
  const ref = D.referencia || { puntajes:{}, perfiles:{} }, hayRef = Object.keys(ref.puntajes || {}).length > 0;
  const comparables = rk.filter(x => ref.puntajes && ref.puntajes[x.s.id] !== undefined);
  const coinciden = comparables.filter(x => Math.abs(x.p - ref.puntajes[x.s.id]) <= tol).length;
  const difMax = comparables.length ? Math.max(...comparables.map(x => Math.abs(x.p - ref.puntajes[x.s.id]))) : null;
  const ordenRef = hayRef ? Object.entries(ref.puntajes).sort((a, c) => c[1] - a[1]).map(x => x[0]) : [];
  const ordenIgual = hayRef && ordenRef.length === rk.length && ordenRef.every((id, i) => rk[i].s.id === id);
  const ag = M.agregarPanel(), difAg = ag ? Math.max(...D.criterios.map(c => Math.abs(c.peso - ag.criterios[c.id]))) : null;
  const sumaC = D.criterios.reduce((a, c) => a + c.peso, 0), sumaG = Object.values(wg).reduce((a, c) => a + c, 0);
  const inv = [

/* ==========================================================================
   P. ADMINISTRACIÓN CON CONTRASEÑA
   La clave se verifica con PBKDF2-SHA256 (WebCrypto) contra un hash con sal;
   la contraseña no está escrita en el código. Tras cinco intentos fallidos el
   acceso se bloquea un minuto, y la sesión se cierra sola tras 20 minutos sin
   actividad. En un sitio estático esto impide la edición casual; los cambios
   quedan en el navegador de quien los hace y sólo llegan al público cuando el
   autor exporta el modelo y reemplaza el archivo publicado.
   ========================================================================== */
const CLAVE_ADMIN = {"sal":"6AzD3TYhR8BanA8U3sEjpg==","iter":210000,"hash":"SVHVZnCriXCDR2cRjdoCNjjJUbjL1C+1MVsenST7uP4="};
const LLAVE_CLAVE = "sbn_sur_clave";
const SESION_MIN = 20, MAX_INTENTOS = 5;
const ACCESO = { fallos:0, hasta:0 };
function claveVigente(){
  try{ const c = JSON.parse(localStorage.getItem(LLAVE_CLAVE) || "null"); if(c && c.sal && c.hash && c.iter) return c; }catch(e){}
  return CLAVE_ADMIN;
}
const b64a = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const ab64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function derivar(clave, sal, iter){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
  return ab64(await crypto.subtle.deriveBits({ name:"PBKDF2", hash:"SHA-256", salt:sal, iterations:iter }, k, 256));
}
function igualSeguro(a, b){ if(a.length !== b.length) return false; let r = 0; for(let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }
async function verificarClave(clave){
  const c = claveVigente();
  return igualSeguro(await derivar(clave, b64a(c.sal), c.iter), c.hash);
}
function tocarSesion(){
  if(!EST.admin) return;
  if(Date.now() - EST.admin.ultimo > SESION_MIN * 60000){ cerrarSesion(T("La sesión se cerró por inactividad.","The session closed after inactivity.")); return; }
  EST.admin.ultimo = Date.now();
}
function cerrarSesion(motivo){
  EST.admin = null; registrar("Cierre de sesión", motivo || "manual");
  EST.avisoLogin = motivo || null;
  if(VISTA === "admin") PINTAR.admin();
}
setInterval(() => { if(EST.admin && Date.now() - EST.admin.ultimo > SESION_MIN * 60000) cerrarSesion(T("La sesión se cerró por inactividad.","The session closed after inactivity.")); }, 30000);
document.addEventListener("pointerdown", tocarSesion, { passive:true });
document.addEventListener("keydown", tocarSesion);

  const bloqueado = Date.now() < ACCESO.hasta, sinCripto = !(window.crypto && crypto.subtle);
  el("v-admin").innerHTML = `

    <p class="mini">${T("La sesión se cierra sola tras "+SESION_MIN+" minutos sin actividad y al recargar la página. Lo que edite queda en este navegador hasta que exporte el modelo y reemplace el archivo publicado: ningún visitante puede alterar el modelo que ven los demás.",

      registrar("Acceso de administración", "correcto"); PINTAR.admin(); return;
    }
    ACCESO.fallos++; registrar("Acceso denegado", "intento "+ACCESO.fallos);
    if(ACCESO.fallos >= MAX_INTENTOS){ ACCESO.hasta = Date.now() + 60000; ACCESO.fallos = 0; pintarLogin(); return; }
    btn.disabled = false; btn.lastChild.textContent = T("Entrar","Sign in");

    el("clave").value = ""; el("clave").focus();
  });
  const c = el("clave"); if(c && !c.disabled) c.focus({ preventScroll:true });
