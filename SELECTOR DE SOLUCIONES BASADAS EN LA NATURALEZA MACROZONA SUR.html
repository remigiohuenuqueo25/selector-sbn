    <div class="informe-cab"><p class="sello">${esc(txMeta("institucion")).toUpperCase()}</p>
      <h1 style="font-family:var(--serif);font-weight:400;font-size:1.6rem">${T("Informe de selección de solución basada en la naturaleza","Nature-based solution selection report")}</h1>
      <p class="sello">${esc(txMeta("titulo"))} · ${T("modelo","model")} v${esc(D.meta.version)} · ${esc(D.meta.fecha)} · ${T("emitido el ","issued ")}${esc(hoy())}</p></div>
    ${h(T("Datos de la consulta","Query data"))}
    <table><tbody>
      <tr><th style="width:42%">${T("Comuna","Commune")}</th><td>${esc(e.comuna)}, ${esc(com.region || "")}</td></tr>
      <tr><th>${T("Precipitación media anual (referencial)","Mean annual rainfall (reference)")}</th><td>${fmt(com.pp,0)} mm · ${esc(pal(com.zona || ""))}</td></tr>
      <tr><th>${T("Tipo de proyecto","Project type")}</th><td>${esc(nomOpc("proyecto", e.proyecto))}</td></tr>
      <tr><th>${T("Emplazamiento","Location")}</th><td>${esc(nomOpc("emplazamiento", e.emplazamiento))}</td></tr>
      <tr><th>${T("Finalidad declarada","Stated purpose")}</th><td>${esc(nomOpc("finalidad", e.finalidad))}</td></tr>
      <tr><th>${T("Superficie de suelo disponible","Available ground area")}</th><td>${fmt(e.superficie,0)} m²</td></tr>
      <tr><th>${T("Pendiente del terreno","Ground slope")}</th><td>${fmt(e.pendiente,1)} %</td></tr>
      <tr><th>${T("Capacidad de infiltración","Infiltration capacity")}</th><td>${esc(nomOpc("infiltracion", e.infiltracion))}</td></tr>
      <tr><th>${T("Espacio libre en superficie","Open space at ground level")}</th><td>${esc(nomOpc("espacio", e.espacio))}</td></tr>
      <tr><th>${T("Área drenada conectada","Connected drained area")}</th><td>${fmt(e.area_drenada,0)} m²</td></tr>
      <tr><th>${T("Cubierta o fachada disponible","Available roof or façade")}</th><td>${fmt(e.cubierta,0)} m²</td></tr>
      <tr><th>${T("Prioridad declarada","Stated priority")}</th><td>${esc(nomOpc("prioridad", e.prioridad))}${R.prioridad.ajustado ? " · ×"+fmt(R.prioridad.factor,1) : ""}</td></tr>
    </tbody></table>
    ${h(T("Resultado","Result"))}
    ${g ? '<p>'+T("Para las condiciones declaradas, la solución mejor evaluada es ","For the declared conditions, the best-rated solution is ")+'<strong>'+esc(nomSol(g.sol.id))+'</strong>'+
      T(", con "," with ")+'<strong>'+fmt(g.puntaje,1)+T(" puntos de 100"," points out of 100")+'</strong>'+T(" y clasificación "," and the rating ")+'<strong>'+esc(etBanda(g.banda)).toLowerCase()+'</strong>. '+
      T("Su costo de construcción de referencia es de ","Its reference construction cost is ")+fmt(g.sol.cc.uf,2)+' UF/m² ('+fmt(g.sol.cc.clp,0)+T(" pesos por m², sin IVA)."," pesos per m², excl. VAT).")+
      (R.admisibles[1] ? ' '+T("El segundo lugar, ","Second place, ")+esc(nomSol(R.admisibles[1].sol.id))+' ('+fmt(R.admisibles[1].puntaje,1)+T("), queda a "+fmt(g.puntaje - R.admisibles[1].puntaje,1)+" puntos.","), is "+fmt(g.puntaje - R.admisibles[1].puntaje,1)+" points behind.") : '')+'</p>'
      : '<p>'+T("Ninguna tipología supera el filtro de aptitud para las condiciones declaradas.","No typology passes the suitability filter for the declared conditions.")+'</p>'}
    ${h(T("Orden de prelación de las soluciones admisibles","Ranking of admissible solutions"))}
    <table><thead><tr><th style="width:2.2rem">#</th><th>${T("Solución","Solution")}</th><th class="num">${T("Puntaje","Score")}</th><th class="num">${T("Rango","Range")}</th><th class="num">UF/m²</th><th>${T("Banda","Band")}</th></tr></thead><tbody>
      ${R.admisibles.map(a => '<tr><td>'+a.pos+'</td><td>'+esc(nomSol(a.sol.id))+'</td><td class="num">'+fmt(a.puntaje,1)+'</td><td class="num">'+fmt(a.rango.min,1)+'–'+fmt(a.rango.max,1)+'</td><td class="num">'+fmt(a.sol.cc.uf,2)+'</td><td>'+esc(etBanda(a.banda))+'</td></tr>').join("")}
    </tbody></table>
    ${R.admisibles.some(a => a.ajustes.length) ? '<p style="margin-top:.5rem"><strong>'+T("Ajustes por condición de sitio. ","Site-condition adjustments. ")+'</strong>'+
      R.admisibles.filter(a => a.ajustes.length).map(a => esc(nomSol(a.sol.id))+": "+a.ajustes.map(x => esc(x.subcriterio+" "+x.desde+" → "+x.hacia+". "+fundamentoAjuste(x))).join(" ")).join(" ")+'</p>' : ''}
    ${R.descartadas.length ? h(T("Soluciones descartadas y qué les falta","Ruled-out solutions and what they lack"))+'<table><thead><tr><th style="width:28%">'+T("Solución","Solution")+'</th><th style="width:18%">'+T("Regla","Rule")+'</th><th>'+T("Motivo y condición para ser viable","Reason and condition to be viable")+'</th></tr></thead><tbody>'+
      R.descartadas.flatMap(d => d.motivos.map((m, i) => '<tr><td>'+(i === 0 ? esc(nomSol(d.sol.id)) : '')+'</td><td>'+esc(m.r)+'</td><td>'+esc(m.t)+(m.falta ? ' <em>'+esc(m.falta)+'</em>' : '')+'</td></tr>')).join("")+'</tbody></table>' : ''}
    ${g ? h(T("Recomendación constructiva de la solución elegida","Construction recommendation for the chosen solution"))+'<p>'+esc(trad(g.sol, ["ficha","definicion"]))+'</p>'+
      '<table><thead><tr><th style="width:28%">'+T("Partida","Item")+'</th><th style="width:22%">'+T("Espesor o cantidad","Thickness or quantity")+'</th><th>'+T("Observación","Note")+'</th></tr></thead><tbody>'+
      (trad(g.sol, ["capas"]) || []).map(c => '<tr><td>'+esc(c.n)+'</td><td>'+esc(c.esp)+'</td><td>'+esc(c.det)+'</td></tr>').join("")+'</tbody></table>'+
      '<p style="margin-top:.5rem"><strong>'+T("Ejecución. ","Construction. ")+'</strong>'+(trad(g.sol, ["ejecucion"]) || []).map(esc).join(" ")+'</p>'+
      '<p><strong>'+T("Mantención. ","Maintenance. ")+'</strong>'+esc(trad(g.sol, ["cm","frecuencia"]))+' '+(trad(g.sol, ["mantencion"]) || []).map(esc).join(" ")+'</p>'+
      '<p style="margin-top:.4rem"><em>'+T("Las capas y espesores son de referencia para anteproyecto y no sustituyen el proyecto de especialidad.","Layers and thicknesses are references for preliminary design and do not replace the specialist design.")+'</em></p>' : ''}
    ${h(T("Parámetros del modelo empleados","Model parameters used"))}
    <table><thead><tr><th>${T("Subcriterio","Sub-criterion")}</th><th class="num">${T("Peso global","Global weight")}</th>${g ? '<th>'+T("Nivel","Level")+'</th><th class="num">'+T("Valor","Value")+'</th><th class="num">'+T("Aporte","Contribution")+'</th>' : ''}</tr></thead><tbody>
      ${D.subcriterios.map(s => { const d = g ? g.detalle.find(x => x.sub === s.id) : null;
        return '<tr><td>'+esc(s.id)+' · '+esc(subNom(s.id))+'</td><td class="num">'+fmt(R.wg[s.id],5)+'</td>'+(d ? '<td>'+esc(d.nivel || "—")+'</td><td class="num">'+fmt(d.valor,5)+'</td><td class="num">'+fmt(d.aportePct,2)+'</td>' : '')+'</tr>'; }).join("")}
      <tr class="total"><td>Total</td><td class="num">${fmt(R.suma,5)}</td>${g ? '<td colspan="2">'+T("Puntaje","Score")+'</td><td class="num">'+fmt(g.puntaje,2)+'</td>' : ''}</tr>
    </tbody></table>
    <p style="margin-top:.5rem">${T("Pesos de criterio: ","Criterion weights: ")}${D.criterios.map(c => esc(critNombre(c.id)).toLowerCase()+" "+fmt(R.wc[c.id],5)).join(" · ")}. ${T("Panel de ","Panel of ")}${D.expertos.filter(x => x.enPanel).length}${T(" expertos de la macrozona sur. RC de la matriz agregada de criterios: "," experts from southern Chile. CR of the aggregated criteria matrix: ")}${fmt(D.consistencia.rc_criterios_panel,5)}. ${esc(txMeta("metodo"))}</p>
    ${h(T("Advertencia de alcance","Scope notice"))}
    <p>${T("Este informe orienta la selección de una tipología y entrega recomendaciones constructivas de referencia. No reemplaza el diseño hidráulico ni el cálculo estructural, no dimensiona la obra y no constituye certificación, aprobación ni documento con validez normativa o municipal.",
      "This report guides the choice of a typology and gives reference construction recommendations. It does not replace hydraulic design or structural calculation, does not size the works and is not a certificate, approval or document with regulatory or municipal standing.")}</p>
    <p>${esc(txMeta("nota"))} ${T("Los costos son referenciales, sin IVA, y no sustituyen una cotización. Las precipitaciones son referenciales y no intervienen en el puntaje.","Costs are for reference, excluding VAT, and do not replace a quote. Rainfall figures are for reference and do not enter the score.")}</p>
    <p class="sello" style="margin-top:1.4rem;border-top:1px solid var(--linea);padding-top:.6rem">${T("Todo resultado es reproducible a mano con los datos de la consulta, los pesos y los valores de nivel de la versión indicada. Consulta emitida el ","Every result can be reproduced by hand from the query data, the weights and the level values of the stated version. Query issued ")}${esc(ahora())}.</p>
  </article>`;
  el("btnCopiarInf").addEventListener("click", ev => copiar(n.querySelector(".informe").innerText, ev.currentTarget));
};

/* ==========================================================================
   R. ARRANQUE
   ========================================================================== */
recuperar();
aplicarTema();
EST.entrada = clonar(ENTRADA_DEF);
EST.resultado = evaluar(EST.entrada);
VISTA = location.hash.replace("#","") || "inicio";
pintarMarco();
registrar("Inicio de sesión pública", "Modelo v"+EST.D.meta.version);
ir(VISTA, true);
</script>
